name: iOS Simulator Copy (Fit Hard)

# Manual run only. Builds an UNSIGNED simulator copy of the SAME tree the
# device workflow ships (candidate 12's source: store-build/ with www staged
# from ../app/), boots a simulator on the runner, installs + cold-launches
# the copy, and captures a first-open screenshot. Test lane only: proves
# nothing about the real phone door; the device build + ios-ipa-upload.yml
# are untouched by this file.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: store-build
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage the certified www tree (same staging as the device workflow)
        run: |
          rm -rf www
          mkdir www
          cp -R ../app/. www/
          rm -f www/privacy.html
          echo "Staged service worker: $(grep -o 'fitapp-v[0-9]*' www/service-worker.js | head -1)"
          ls www | wc -l

      - name: Install dependencies and sync iOS
        run: |
          npm ci
          npx cap sync ios

      - name: Build the simulator copy (no signing)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/sim-build" \
            CODE_SIGNING_ALLOWED=NO
          find "$RUNNER_TEMP/sim-build/Build/Products" -maxdepth 2 -name "*.app" -print

      - name: Boot a simulator, install, cold-launch, screenshot
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/sim-build/Build/Products" -maxdepth 2 -name "App.app" | head -1)
          echo "App: $APP_PATH"
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j", "devices", "available"]))
          best = None
          for runtime, devs in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      ver = runtime.rsplit("-", 1)[-1]
                      if best is None or ver > best[0]:
                          best = (ver, d["udid"], d["name"])
          print(best[1])
          PY
          )
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl launch booted com.ilseplacencia.fithard
          sleep 8
          xcrun simctl io booted screenshot "$RUNNER_TEMP/fit-first-open.png"
          ls -la "$RUNNER_TEMP/fit-first-open.png"
          cd "$RUNNER_TEMP/sim-build/Build/Products/Release-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent App.app "$RUNNER_TEMP/fit-sim-app.zip"
          ls -la "$RUNNER_TEMP/fit-sim-app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: fit-sim-copy
          path: |
            ${{ runner.temp }}/fit-sim-app.zip
            ${{ runner.temp }}/fit-first-open.png
          if-no-files-found: error
          retention-days: 30
