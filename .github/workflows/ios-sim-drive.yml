name: iOS Simulator DRIVE (Fit Hard, QA)

# Manual run only. QA Tester's drive lane for Fit Hard candidate 12:
# builds the SAME unsigned simulator copy as ios-sim.yml (candidate
# 12's source: store-build/ with www staged from ../app/ exactly as
# the device workflow stages it, service worker fitapp-v86), boots a
# simulator, installs it, then drives the full finishing-order spine
# with Maestro (qa-drive/fit-drive.yaml): sign up -> the journey
# (check-in + week plan) -> sign out -> sign in -> the greeting and
# the planned week stand -> SECOND account, data never mixing. Stage
# screenshots + the Maestro step records upload as the fit-sim-drive
# artefact on EVERY outcome, pass or fail, so QA scores from evidence.
# Test lane only: a pass here proves journeys, buttons, saving and
# isolation ON A SIMULATOR; it proves nothing about the real-phone
# door, whose pass lives on the device lane alone.
# The device build + ios-ipa-upload.yml + ios-sim.yml are untouched
# by this file.
# Credentials: the tester passwords reach the drive only through the
# repo secrets QA_FIT_TEST_PASSWORD and QA_FIT_TEST_PASSWORD2 (sealed
# by QA; the testers are QA-created test accounts under the
# tester-account ruling, their casts held in QA's test record, never
# in this repo).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drive:
    runs-on: macos-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Guard the tester secrets
        env:
          TEST_PASSWORD: ${{ secrets.QA_FIT_TEST_PASSWORD }}
          TEST_PASSWORD2: ${{ secrets.QA_FIT_TEST_PASSWORD2 }}
        run: |
          if [ -z "$TEST_PASSWORD" ] || [ -z "$TEST_PASSWORD2" ]; then
            echo "::error::QA_FIT_TEST_PASSWORD and/or QA_FIT_TEST_PASSWORD2 secret is not set on this repo; the drive cannot run its two accounts. QA seals them; nothing else is missing."
            exit 1
          fi
          echo "Tester secrets present."

      - name: Stage the certified www tree (same staging as the device workflow)
        working-directory: store-build
        run: |
          rm -rf www
          mkdir www
          cp -R ../app/. www/
          rm -f www/privacy.html
          echo "Staged service worker: $(grep -o 'fitapp-v[0-9]*' www/service-worker.js | head -1)"
          ls www | wc -l

      - name: Install dependencies and sync iOS
        working-directory: store-build
        run: |
          npm ci
          npx cap sync ios

      - name: Build the simulator copy (no signing)
        working-directory: store-build
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/sim-build" \
            CODE_SIGNING_ALLOWED=NO
          find "$RUNNER_TEMP/sim-build/Build/Products" -maxdepth 2 -name "*.app" -print

      - name: Boot a simulator and install the copy
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/sim-build/Build/Products" -maxdepth 2 -name "App.app" | head -1)
          echo "App: $APP_PATH"
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j", "devices", "available"]))
          best = None
          for runtime, devs in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      ver = runtime.rsplit("-", 1)[-1]
                      if best is None or ver > best[0]:
                          best = (ver, d["udid"], d["name"])
          print(best[1])
          PY
          )
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install booted "$APP_PATH"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Drive the spine (Maestro)
        env:
          TEST_EMAIL: "placenciailse.qa.fit@gmail.com"
          TEST_PASSWORD: ${{ secrets.QA_FIT_TEST_PASSWORD }}
          TEST_EMAIL2: "placenciailse.qa.fit2@gmail.com"
          TEST_PASSWORD2: ${{ secrets.QA_FIT_TEST_PASSWORD2 }}
          MAESTRO_DRIVER_START_TIMEOUT: "180"
        run: |
          maestro test \
            -e TEST_EMAIL="$TEST_EMAIL" \
            -e TEST_PASSWORD="$TEST_PASSWORD" \
            -e TEST_EMAIL2="$TEST_EMAIL2" \
            -e TEST_PASSWORD2="$TEST_PASSWORD2" \
            qa-drive/fit-drive.yaml

      - name: Collect the drive record
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/drive-record"
          find "$HOME/.maestro" -name "*.png" -exec cp {} "$RUNNER_TEMP/drive-record/" \; 2>/dev/null || true
          # Step records only (hierarchy dumps). commands.json is NEVER
          # collected: Maestro records the drive env (incl. the tester
          # passwords) in plaintext in it — Pace v1's artefact carried
          # it and the value had to be treated as burnt (QA, 22 Oct).
          find "$HOME/.maestro" -name "step-*.json" -exec cp {} "$RUNNER_TEMP/drive-record/" \; 2>/dev/null || true
          xcrun simctl io booted screenshot "$RUNNER_TEMP/drive-record/final-frame.png" || true
          ls -la "$RUNNER_TEMP/drive-record/" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fit-sim-drive
          path: ${{ runner.temp }}/drive-record/
          if-no-files-found: warn
          retention-days: 30
