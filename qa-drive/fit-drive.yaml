      text: "Hey! I'm Wally. Welcome in! What's your name?"
    timeout: 30000
- takeScreenshot: 05-tour-done
# ---------- the setup sheet, completed if it stands ----------------
# The legs meet the sheet after the tour and dismiss it; the spine
# COMPLETES it, sheet-walk style (the b12 verdict's sheet-completed
# control + the b10 round trip's road): the full-form birth is the
# strongest persistence shape, and its numbers are the round trip's
# own typed values. The name field is left as the tour left it —
# the greeting below is the sentinel's proof. Handled only if the
# sheet stands.
- runFlow:
    when:
      visible: "Welcome. Let us set up your app."
    commands:
      - tapOn:
          text: "82"
          waitUntilVisible: true
      - inputText: "70"
      - tapOn:
          text: "168"
          waitUntilVisible: true
      - inputText: "170"
      - tapOn:
          text: "34"
          waitUntilVisible: true
      - inputText: "30"
      - tapOn:
          point: "90%, 59%"
      - takeScreenshot: 06-setup-filled
      - swipe:
          direction: UP
      - swipe:
          direction: UP
      - tapOn:
          text: "Start my app"
          waitUntilVisible: true
      - extendedWaitUntil:
          notVisible:
            text: "Welcome. Let us set up your app."
          timeout: 30000
- takeScreenshot: 07-entry-clear
