# Fit Hard 12 simulator drive — QA Tester chair.
# Version: v4 (2026-10-23) — v3 FAILED-INSTRUMENT at drive 4 (run
# 39953241647, step-019): THE ACCOUNT WAS CREATED AND THE TOUR
# STOOD ASKING ITS NAME IN THE FAILURE FRAME ITSELF — and the
# 60 s wait for "What's your name?" still failed, because the
# tree node reads "Hey! I'm Wally. Welcome in! What's your
# name?" and this lane's matching is FULL-NODE: a fragment of a
# composed heading never matches (class banked from this
# drive's own hierarchy: text exact, bounds on screen, enabled
# true). v4 carries the complete heading at all three name-ask
# selectors; the same completion was applied fleet-wide the
# same hour (Pip, Rue, Skip headings — each sourced from its
# own app's tree). v3's cures stand untouched. v3: 13,423 B.
# Version: v3 (2026-10-23) — v2 FAILED-INSTRUMENT at drive 3 (run
# 39948998502, step-020, the tour name-step wait): the furthest
# this lane has travelled. The type LANDS on this door now (02:
# 20 bullets standing, the bar dismissed, Continue clear) — then
# the bar RE-STOOD over the button before the submit tap, the
# tap was absorbed (BAR-OVER-SUBMIT, second door), and the
# door-gone wait FALSE-PASSED: the keyboard had scrolled the
# card so the door line's node left the rendered tree (scroll-
# unrender — a notVisible wait cannot tell hidden from
# unrendered). The name wait then failed fairly on the standing
# card. v3 cures: (1) the three password dismissals take the
# MEASURED tick point (90%, 59%) — the tick's centre read off
# drive 3's own frame, matching NeedsMe's independent measure;
# (2) every Continue gains retryTapIfNoChange, so a re-stood
# bar costs one absorbed tap, not the drive; (3) the three
# notVisible door-gone waits are DELETED — the following
# asserts carry the proof honestly. The visible waits on the
# door line (cold open + sign-out proofs) stand: 00-door proves
# the line in pixels on this surface. The five remaining
# (90%, 62%) taps are email-leg and sheet-leg dismissals,
# proven or keyboard-proven, untouched. v2: 12,343 B.
# Version: v2 (2026-10-23) — v1 FAILED-INSTRUMENT at drive 1 (run
# 39942569202, step-011): the email inputText never landed — the
# frames show the door's field EMPTY with NO keyboard standing (the
# field tap raced the Settings sheet's settle; hideKeyboard passed
# as a no-op, the arrow tap went nowhere on an empty field, and the
# "Your password" tap died). v2 cures: (a) the fleet hideKeyboard
# class — every bare hideKeyboard replaced by the accessory-bar
# Done tap (90%, 62%); this drive REFINES the class record:
# hideKeyboard fails only when a keyboard actually stands; with
# none it silently no-ops, which is why the failure surfaced one
# step later here. (b) the focus race: waitForAnimationToEnd after
# each door field tap + retryTapIfNoChange on the field taps and
# the arrow tap. v1: 11,093 B / 106 commands.
# The FINISHING ORDER spine for candidate 12's simulator copy
# (bundle com.ilseplacencia.fithard, version 1.1, build 12, SW
# fitapp-v86; the copy's byte-leg pins stand in
# store-uploads/scratch/fit-sim/PINS.md). Spine: sign up -> the real
# journey (the tour name under the sentinel + the setup sheet
# completed + a Great check-in + the week planned) -> sign out ->
# sign in -> the data stands -> a SECOND account whose space holds
# none of it. The persistence assertions are the point of this drive:
# they are F-B11-1's cure read on the sim copy — a door-made
# account's journey data reaching the cloud and standing after a
# fresh sign-in, corroborated at REST from QA's chair beside the
# drive (the b12 verdict's own shape).
# Structural template: pace-drive.yaml v2 + mealprep-drive.yaml —
# every tap waits until its target is visible; sheets are waited
# for, handled, and proven gone before anything behind them is
# touched.
# TEST_EMAIL / TEST_PASSWORD / TEST_EMAIL2 / TEST_PASSWORD2 arrive
# as workflow env at dispatch (passwords from QA's mode-600 cast,
# sealed the Pace way); the values never appear in this file or the
# repo. NOTE: Maestro's commands.json records env values in
# plaintext — the workflow's collect step must NOT upload
# commands.json (the Pace v1 lesson; see pace-drive.yaml +
# ios-sim-drive.yml).
# Selector provenance for every string below: fit-drive-NOTES.md.
appId: com.ilseplacencia.fithard
---
# ---------- cold open: the door stands alone (purity) -------------
# A pristine signed-out boot stands under body.signedOut with ONE
# card — the account card; no first-open sheet stands over Fit's
# door (the b12 purity walk). The door heading is the cold proof.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Sign in or make your account"
    timeout: 90000
- takeScreenshot: 00-door
# ---------- stage (i): sign up, account 1 (the door's one button ---
# ---------- does both: email step, then password step) -------------
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: "${TEST_EMAIL}"
- tapOn:
    point: "90%, 62%"
- takeScreenshot: 01-email-step
- tapOn:
    text: "Next"
    waitUntilVisible: true
    retryTapIfNoChange: true
- tapOn:
    text: "Your password"
    waitUntilVisible: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: "${TEST_PASSWORD}"
- tapOn:
    point: "90%, 59%"
- takeScreenshot: 02-password-step
- tapOn:
    text: "Continue"
    waitUntilVisible: true
    retryTapIfNoChange: true
- takeScreenshot: 03-inside
# ---------- first entry: the mascot tour asks the name -------------
# The tour's name step is the profile name's birth (the v4 shape);
# the sentinel is typed there, then the tour is walked to its Done,
# exactly as the b11/b12 libs walked it (Next until Done stands).
- extendedWaitUntil:
    visible:
      text: "Hey! I'm Wally. Welcome in! What's your name?"
    timeout: 60000
- tapOn:
    text: "Your name"
    waitUntilVisible: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: "Sim Driver Fit"
- tapOn:
    point: "90%, 59%"
- takeScreenshot: 04-tour-name
- tapOn:
    text: "Next"
    waitUntilVisible: true
- tapOn:
    text: "Next"
    waitUntilVisible: true
- tapOn:
    text: "Next"
    waitUntilVisible: true
- tapOn:
    text: "Done"
    waitUntilVisible: true
- extendedWaitUntil:
    notVisible:
      text: "Hey! I'm Wally. Welcome in! What's your name?"
    timeout: 30000
- takeScreenshot: 05-tour-done
# ---------- the setup sheet, completed if it stands ----------------
# The legs meet the sheet after the tour and dismiss it; the spine
# COMPLETES it, sheet-walk style (the b12 verdict's sheet-completed
# control + the b10 round trip's road): the full-form birth is the
# strongest persistence shape, and its numbers are the round trip's
# own typed values. The name field is left as the tour left it —
# the greeting below is the sentinel's proof. Handled only if the
# sheet stands.
- runFlow:
    when:
      visible: "Welcome. Let us set up your app."
    commands:
      - tapOn:
          text: "82"
          waitUntilVisible: true
      - inputText: "70"
      - tapOn:
          text: "168"
          waitUntilVisible: true
      - inputText: "170"
      - tapOn:
          text: "34"
          waitUntilVisible: true
      - inputText: "30"
      - tapOn:
          point: "90%, 62%"
      - takeScreenshot: 06-setup-filled
      - tapOn:
          text: "Start my app"
          waitUntilVisible: true
      - extendedWaitUntil:
          notVisible:
            text: "Welcome. Let us set up your app."
          timeout: 30000
- takeScreenshot: 07-entry-clear
# ---------- stage (ii)a: Today — the sentinel greets, the ----------
# ---------- check-in lands -----------------------------------------
- tapOn:
    id: "sidebarToggle"
- tapOn:
    text: "Today"
    waitUntilVisible: true
- assertVisible:
    text: "Sim Driver Fit"
- takeScreenshot: 08-greeting
- tapOn:
    text: "Great"
    waitUntilVisible: true
- takeScreenshot: 09-checkin-great
# ---------- stage (ii)b: Meals — plan the week ---------------------
- tapOn:
    id: "sidebarToggle"
- tapOn:
    text: "Meals"
    waitUntilVisible: true
- tapOn:
    text: "Meal plan"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "No meals planned yet."
    timeout: 60000
- takeScreenshot: 10-plan-empty
- tapOn:
    text: "Plan my week"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Your week is planned. Tap any meal for the recipe."
    timeout: 60000
- takeScreenshot: 11-week-planned
# ---------- stage (iii): sign out through the app's own control ----
- tapOn:
    id: "sidebarToggle"
- tapOn:
    text: "Settings"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign out"
    timeout: 90000
- takeScreenshot: 12-settings-account
- tapOn:
    text: "Sign out"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign in or make your account"
    timeout: 60000
- takeScreenshot: 13-signed-out
# ---------- stage (iv): sign in again — the data stands ------------
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: "${TEST_EMAIL}"
- tapOn:
    point: "90%, 62%"
- tapOn:
    text: "Next"
    waitUntilVisible: true
- tapOn:
    text: "Your password"
    waitUntilVisible: true
- inputText: "${TEST_PASSWORD}"
- tapOn:
    point: "90%, 59%"
- tapOn:
    text: "Continue"
    waitUntilVisible: true
    retryTapIfNoChange: true
# The tour state is saved with the account, so no tour is expected;
# it is still handled if it stands.
- runFlow:
    when:
      visible: "Skip tour"
    commands:
      - tapOn:
          text: "Skip tour"
          waitUntilVisible: true
- takeScreenshot: 14-relogin-inside
- tapOn:
    id: "sidebarToggle"
- tapOn:
    text: "Today"
    waitUntilVisible: true
# The sentinel stands: the greeting carries the account's own name.
- assertVisible:
    text: "Sim Driver Fit"
- takeScreenshot: 15-relogin-greeting
- tapOn:
    id: "sidebarToggle"
- tapOn:
    text: "Meals"
    waitUntilVisible: true
- tapOn:
    text: "Meal plan"
    waitUntilVisible: true
# The plan stands: the planned line renders, the empty state never.
- extendedWaitUntil:
    visible:
      text: "Your week is planned. Tap any meal for the recipe."
    timeout: 60000
- assertNotVisible:
    text: "No meals planned yet."
- takeScreenshot: 16-relogin-plan-stands
# ---------- sign out again ------------------------------------------
- tapOn:
    id: "sidebarToggle"
- tapOn:
    text: "Settings"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign out"
    timeout: 90000
- tapOn:
    text: "Sign out"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Sign in or make your account"
    timeout: 60000
- takeScreenshot: 17-signed-out-again
# ---------- stage (v): the second account — isolation --------------
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
- inputText: "${TEST_EMAIL2}"
- tapOn:
    point: "90%, 62%"
- tapOn:
    text: "Next"
    waitUntilVisible: true
- tapOn:
    text: "Your password"
    waitUntilVisible: true
- inputText: "${TEST_PASSWORD2}"
- tapOn:
    point: "90%, 59%"
- tapOn:
    text: "Continue"
    waitUntilVisible: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      text: "Hey! I'm Wally. Welcome in! What's your name?"
    timeout: 60000
- tapOn:
    text: "Your name"
    waitUntilVisible: true
- inputText: "Second Driver Fit"
- tapOn:
    point: "90%, 59%"
- tapOn:
    text: "Next"
    waitUntilVisible: true
- tapOn:
    text: "Next"
    waitUntilVisible: true
- tapOn:
    text: "Next"
    waitUntilVisible: true
- tapOn:
    text: "Done"
    waitUntilVisible: true
- runFlow:
    when:
      visible: "Welcome. Let us set up your app."
    commands:
      - tapOn:
          text: "82"
          waitUntilVisible: true
      - inputText: "70"
      - tapOn:
          text: "168"
          waitUntilVisible: true
      - inputText: "170"
      - tapOn:
          text: "34"
          waitUntilVisible: true
      - inputText: "30"
      - tapOn:
          point: "90%, 62%"
      - tapOn:
          text: "Start my app"
          waitUntilVisible: true
      - extendedWaitUntil:
          notVisible:
            text: "Welcome. Let us set up your app."
          timeout: 30000
- takeScreenshot: 18-second-account-in
- tapOn:
    id: "sidebarToggle"
- tapOn:
    text: "Today"
    waitUntilVisible: true
# Isolation, name side: this space greets its own name, and the
# first account's sentinel never renders here.
- assertVisible:
    text: "Second Driver Fit"
- assertNotVisible:
    text: "Sim Driver Fit"
- takeScreenshot: 19-isolation-greeting
- tapOn:
    id: "sidebarToggle"
- tapOn:
    text: "Meals"
    waitUntilVisible: true
- tapOn:
    text: "Meal plan"
    waitUntilVisible: true
# Isolation, plan side: this account's plan is its own — empty,
# fill offered; the first account's planned line never renders.
- extendedWaitUntil:
    visible:
      text: "No meals planned yet."
    timeout: 60000
- assertNotVisible:
    text: "Your week is planned. Tap any meal for the recipe."
- takeScreenshot: 20-isolation-plan
# ---------- stage (vi): the delete leg is NOT in this flow ---------
# Per the registered spine shape, deletion runs from QA's chair
# against the real backend, not in Maestro: each account is deleted
# through the app's own delete flow (Settings account card: "Delete
# my account" -> the password confirm -> "Yes, delete my account")
# from QA's harness, and the close is read beside this drive's
# SIMULATOR results with its access state NAMED, never assumed:
# QA's chair does not reach project fit-app-7f25f owner-side (the
# Fit residue audit stands console-gated on the parked sitting), so
# the read-back is the app-flow completion + the REST auth read
# (a post-delete sign-in refused, the b10 round trip's closing
# shape), and the owner-side full-footprint 404 — users doc +
# slices included — is reported CONSOLE-GATED until the sitting
# lands. It is never written as proven from this chair.
