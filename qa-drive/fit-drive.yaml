    waitUntilVisible: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: "${TEST_PASSWORD}"
- tapOn:
    point: "90%, 59%"
- takeScreenshot: 02-password-step
- tapOn:
