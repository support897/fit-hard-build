# Structural template: pace-drive.yaml v2 + mealprep-drive.yaml —
# every tap waits until its target is visible; sheets are waited
# for, handled, and proven gone before anything behind them is
# touched.
# TEST_EMAIL / TEST_PASSWORD / TEST_EMAIL2 / TEST_PASSWORD2 arrive
# as workflow env at dispatch (passwords from QA's mode-600 cast,
# sealed the Pace way); the values never appear in this file or the
# repo. NOTE: Maestro's commands.json records env values in
# plaintext — the workflow's collect step must NOT upload
# commands.json (the Pace v1 lesson; see pace-drive.yaml +
# ios-sim-drive.yml).
# Selector provenance for every string below: fit-drive-NOTES.md.
appId: com.ilseplacencia.fithard
---
# ---------- cold open: the door stands alone (purity) -------------
# A pristine signed-out boot stands under body.signedOut with ONE
# card — the account card; no first-open sheet stands over Fit's
# door (the b12 purity walk). The door heading is the cold proof.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Sign in or make your account"
    timeout: 90000
- takeScreenshot: 00-door
# ---------- stage (i): sign up, account 1 (the door's one button ---
# ---------- does both: email step, then password step) -------------
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: "${TEST_EMAIL}"
- runFlow:
    when:
      notVisible: "${TEST_EMAIL}"
    commands:
      - tapOn:
          text: "you@example.com"
          waitUntilVisible: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
      - inputText: "${TEST_EMAIL}"
      - extendedWaitUntil:
          visible:
            text: "${TEST_EMAIL}"
          timeout: 15000
- extendedWaitUntil:
    visible:
      text: "${TEST_EMAIL}"
    timeout: 15000
- runFlow:
    when:
      notVisible: "${TEST_EMAIL}"
    commands:
      - tapOn:
          text: "you@example.com"
          waitUntilVisible: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
      - inputText: "${TEST_EMAIL}"
      - extendedWaitUntil:
          visible:
            text: "${TEST_EMAIL}"
          timeout: 15000
- tapOn:
    point: "90%, 62%"
- takeScreenshot: 01-email-step
- tapOn:
    text: "Next"
    waitUntilVisible: true
    retryTapIfNoChange: true
- tapOn:
